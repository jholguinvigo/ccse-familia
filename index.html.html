<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCSE 2026 · Práctica en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#1B2238; --muted:#5A6378; --line:#D5DAE3;
  --brand:#8C1C2C; --brand-ink:#FFFFFF; --gold:#D9A520; --gold-soft:#FBF1D6;
  --ok:#23704A; --ok-soft:#DFF2E7; --bad:#B3261E; --bad-soft:#FBE3E1; --pick:#E7EAF2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121624; --surface:#1B2133; --ink:#E9ECF4; --muted:#9AA3B8; --line:#2E3650;
    --brand:#C2475A; --brand-ink:#FFFFFF; --gold:#E7BC4A; --gold-soft:#3A3220;
    --ok:#5CC48B; --ok-soft:#173528; --bad:#F07A70; --bad-soft:#3D1F1F; --pick:#2A3149;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121624; --surface:#1B2133; --ink:#E9ECF4; --muted:#9AA3B8; --line:#2E3650;
  --brand:#C2475A; --brand-ink:#FFFFFF; --gold:#E7BC4A; --gold-soft:#3A3220;
  --ok:#5CC48B; --ok-soft:#173528; --bad:#F07A70; --bad-soft:#3D1F1F; --pick:#2A3149;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 1rem 3rem}

/* Cabecera tipo pasaporte */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:720px;margin:0 auto;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem}
.seal{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.8rem;color:var(--gold);flex:none}
.top h1{font-size:1.05rem;font-weight:800;flex:1}
.top small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;opacity:.85;font-size:.8rem}
.linkbtn{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:var(--brand-ink);border-radius:999px;padding:.35rem .8rem;font-size:.85rem}
.meter{height:6px;background:rgba(255,255,255,.2)}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s ease}

/* Perfiles */
.hello{padding:2rem 0 1.25rem}
.hello h2{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;letter-spacing:-.01em}
.hello p{color:var(--muted);margin:.5rem 0 0;max-width:46ch}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
.person{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1rem;text-align:left;display:flex;flex-direction:column;gap:.6rem;min-height:150px;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--brand);transform:translateY(-2px)}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.3rem;color:#fff}
.person b{font-size:1.15rem}
.person span{color:var(--muted);font-size:.9rem}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.mini i{display:block;height:100%;background:var(--brand)}

/* Panel de perfil */
.dash{padding:1.75rem 0 1rem}
.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(3rem,14vw,5rem);line-height:1;letter-spacing:-.02em}
.big em{font-style:normal;color:var(--muted);font-size:.45em;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin:.75rem 0 1.5rem;color:var(--muted)}
.stats strong{color:var(--ink)}
.actions{display:grid;gap:.6rem}
.btn{border:none;border-radius:14px;padding:1rem 1.1rem;font-weight:700;font-size:1.05rem;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.btn small{font-weight:400;opacity:.85;font-size:.88rem;display:block}
.btn-main{background:var(--brand);color:var(--brand-ink)}
.btn-alt{background:var(--surface);border:1.5px solid var(--line)}
.btn-alt:hover{border-color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sizes{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:0 0 1.25rem}
.sizes span{color:var(--muted);margin-right:.25rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .95rem;font-weight:700;min-width:3.2rem}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.note{color:var(--muted);font-size:.9rem;margin-top:1.25rem}

/* Bloque de preguntas */
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.25rem 0 .75rem}
.blockhead h2{font-size:1.4rem;font-weight:800}
.blockhead span{color:var(--muted);font-size:.95rem;white-space:nowrap}
.q{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:1rem 1rem .9rem;margin-bottom:.75rem}
.q.is-ok{border-color:var(--ok)}
.q.is-bad{border-color:var(--bad)}
.qtop{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.7rem}
.qn{flex:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--brand);min-width:1.6rem}
.qt{font-weight:700}
.qid{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:.15rem}
.opts{display:grid;gap:.45rem}
.opt{display:flex;gap:.7rem;align-items:center;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;min-height:48px}
.opt .l{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--pick);font-weight:700;font-size:.95rem}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--pick)}
.opt.sel .l{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.verdict{margin-top:.6rem;font-weight:700;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.bar{position:sticky;bottom:0;padding:.75rem 0 calc(.75rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .btn{width:100%;justify-content:center;text-align:center}
.score{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:16px;padding:1rem 1.1rem;margin:0 0 1rem;display:flex;align-items:center;gap:1rem}
.score .big{font-size:2.6rem}
.score p{margin:0}
.empty{padding:2rem 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function bs(){ return (st && st.size) || 10; } // block: {ids, picks, checked, mode}

/* ---------- Guardado (por persona, en este navegador) ---------- */
function key(p){ return "ccse2026:" + p; }
function load(p){
  try { const raw = localStorage.getItem(key(p)); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}
function save(){
  if (!who || !st) return;
  try { localStorage.setItem(key(who.id), JSON.stringify(st)); } catch(e) {}
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newSession(){
  const failed = st ? st.failed : [];
  st = { order: shuffle(DATA.map(q => q.id)), pos: 0, ok: 0, failed: failed || [], size: bs(), started: Date.now() };
  save();
}

          <span>Repasar las falladas<small>${nf ? `${nf} pregunta${nf === 1 ? "" : "s"}, de ${bs()} en ${bs()}` : "Todavía no hay preguntas falladas"}</small></span><span aria-hidden="true">›</span>
        </button>
        <button class="btn ${done ? "btn-main" : "btn-alt"}" id="restart">
          <span>Nueva sesión<small>Vuelve a 0 de ${TOTAL} con otro orden al azar</small></span><span aria-hidden="true">↻</span>
        </button>
      </div>
      ${done ? `<p class="note">Terminaste las 300 preguntas con ${st.ok} aciertos (${pct}%). En el examen real se aprueba con 15 de 25 (60%).</p>`
             : `<p class="note">Tu avance se guarda en este dispositivo. En el examen real se aprueba con 15 de 25 (60%).</p>`}
    </section>`;
  app.querySelectorAll("[data-s]").forEach(c => c.onclick = () => { st.size = +c.dataset.s; save(); dash(); });
  const go = document.getElementById("go");
  if (go) go.onclick = () => startBlock("main");
  document.getElementById("review").onclick = () => startBlock("review");
  document.getElementById("restart").onclick = () => {
    if (st.pos && !done && !confirm("¿Empezar de nuevo desde 0? Se pierde el avance actual (las falladas se conservan).")) return;
    newSession(); dash();
  };
  window.scrollTo(0, 0);
}

/* ---------- Pantalla 3: bloque de 10 ---------- */
function startBlock(mode){
  let ids;
  if (mode === "main") ids = st.order.slice(st.pos, st.pos + bs());
  else ids = shuffle(st.failed).slice(0, bs());
  if (!ids.length) return dash();
  block = { ids, picks: {}, checked: false, mode };
  renderBlock();
}
function renderBlock(){
  const b = block, n = b.ids.length;
  const answered = Object.keys(b.picks).length;
  let head, bar;
  if (b.mode === "main") {
    const from = st.pos + 1, to = st.pos + n;
    head = `<h2>Preguntas ${from}–${to}</h2><span>${b.checked ? `Vas ${st.pos} de ${TOTAL}` : `${answered} de ${n} respondidas`}</span>`;
  } else {
    head = `<h2>Repaso de falladas</h2><span>${b.checked ? `Quedan ${st.failed.length}` : `${answered} de ${n} respondidas`}</span>`;
  }
  let score = "";
  if (b.checked) {
    const good = b.ids.filter(id => b.picks[id] === byId[id].a).length;
    const msg = good === n ? "¡Perfecto!" : good >= Math.ceil(n * .6) ? "Buen bloque." : "Hay que repasar este bloque.";
    score = `<div class="score"><div class="big">${good}/${n}</div><p><strong>${msg}</strong><br>${
      b.mode === "main" ? `Vas ${st.pos} de ${TOTAL} · ${st.ok} aciertos en total` : `Las acertadas salen de la lista de repaso.`}</p></div>`;
  }
  app.innerHTML = `
    <div class="blockhead">${head}</div>
    ${score}
    ${b.ids.map((id, i) => qHTML(byId[id], i)).join("")}
    <div class="bar">${barHTML(answered, n)}</div>`;
  app.querySelectorAll(".opt").forEach(o => o.onclick = () => {
    if (block.checked) return;
    block.picks[+o.dataset.q] = +o.dataset.i;
    const card = o.closest(".q");
    card.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === o));
    refreshBar();
  });
  bindBar();
  updateMeter();
}
function qHTML(q, i){
  const b = block, pick = b.picks[q.id];
  const res = b.checked ? (pick === q.a ? "is-ok" : "is-bad") : "";
  return `<article class="q ${res}">
    <div class="qtop"><span class="qn">${i + 1}.</span>
      <div class="qt">${q.q}<span class="qid">Nº ${q.id} · ${TAREAS[Math.floor(q.id / 1000)]}</span></div></div>
    <div class="opts">${q.o.map((t, k) => {
      let c = "";
      if (b.checked) { if (k === q.a) c = "right"; else if (k === pick) c = "wrong"; }
      else if (k === pick) c = "sel";
      return `<button class="opt ${c}" data-q="${q.id}" data-i="${k}" ${b.checked ? "disabled" : ""}><span class="l">${L[k]}</span><span>${t}</span></button>`;
    }).join("")}</div>
    ${b.checked ? (pick === q.a ? `<div class="verdict ok">Correcta</div>`
      : `<div class="verdict bad">${pick === undefined ? "Sin responder" : "Incorrecta"} · era la ${L[q.a]}) ${q.o[q.a]}</div>`) : ""}
  </article>`;
}
function barHTML(answered, n){
  const b = block;
  if (!b.checked) {
    const missing = n - answered;
    return `<button class="btn btn-main" id="check" ${answered ? "" : "disabled"}>${missing ? `Corregir (faltan ${missing})` : "Corregir"}</button>`;
  }
  if (b.mode === "main") {
    return st.pos >= TOTAL
      ? `<button class="btn btn-main" id="next">Ver resultado final</button>`
      : `<button class="btn btn-main" id="next">Seguir con ${st.pos + 1}–${Math.min(st.pos + bs(), TOTAL)}</button>`;
  }
  return st.failed.length
    ? `<button class="btn btn-main" id="next">Seguir repasando (${st.failed.length})</button>`
    : `<button class="btn btn-main" id="next">Volver al inicio</button>`;
}
function refreshBar(){
  const n = block.ids.length, a = Object.keys(block.picks).length;
  app.querySelector(".bar").innerHTML = barHTML(a, n);
  const span = app.querySelector(".blockhead span"); if (span) span.textContent = `${a} de ${n} respondidas`;
  bindBar();
}
function bindBar(){
  const c = document.getElementById("check"); if (c) c.onclick = check;
  const nx = document.getElementById("next"); if (nx) nx.onclick = next;
}
function check(){
  const b = block;
  const fails = new Set(st.failed);
  b.ids.forEach(id => {
    const good = b.picks[id] === byId[id].a;
    if (b.mode === "main" && good) st.ok++;
    if (good) { if (b.mode === "review") fails.delete(id); }
    else fails.add(id);
  });
  st.failed = [...fails];
  if (b.mode === "main") st.pos += b.ids.length;
  b.checked = true;
  save();
  renderBlock();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function next(){
  if (block.mode === "main") { st.pos >= TOTAL ? dash() : startBlock("main"); }
  else { st.failed.length ? startBlock("review") : dash(); }
  window.scrollTo(0, 0);
}

/* ---------- Utilidades ---------- */
function setTitle(t, s){ document.getElementById("title").innerHTML = `${t}<small>${s}</small>`; }
function updateMeter(){ meter.style.width = st ? (st.pos / TOTAL * 100) + "%" : "0"; }
switchBtn.onclick = () => {
  if (block && !block.checked && Object.keys(block.picks).length && !confirm("Tienes respuestas sin corregir en este bloque. ¿Salir igualmente?")) return;
  home();
};
home();
</script>
